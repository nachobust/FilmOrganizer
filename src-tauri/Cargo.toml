[package]
name = "filmorganizer"
version = "0.2.3"
description = "Film breakdown and scheduling app"
authors = ["nachobust"]
license = "MIT"
edition = "2021"

[lib]
name = "filmorganizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Needed by tauri::generate_context! once tauri.conf.json has plugin settings (the updater).
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
