# Checks every push and pull request: types, tests and a web build.
# The release workflow runs the same checks first and builds no installers if they fail.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot proposes updates.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Web build
        run: npx vite build

  rust-audit:
    name: Rust crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit

      # Known vulnerabilities in the crates locked in Cargo.lock (RustSec advisory database).
      - name: Audit Cargo.lock
        run: cargo audit --file src-tauri/Cargo.lock
