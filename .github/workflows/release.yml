# Builds the desktop installers for Windows, macOS and Linux.
#
# - Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds every
#   installer and attaches them to a DRAFT release. Review it on GitHub, then press Publish.
# - "Run workflow" on the Actions tab builds everything without a release; the installers
#   are kept as downloadable workflow artifacts, which is handy for testing.
#
# Free: GitHub Actions costs nothing on public repositories. The installers are unsigned,
# so Windows and macOS show a one-time warning on first launch (see the README).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (version in the comment), so a moved tag
# can't change what runs here with write access to releases. Dependabot proposes updates.
permissions:
  contents: write

jobs:
  # Same checks as CI: no installers are built if types or tests fail.
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS (Apple Silicon and Intel)
            platform: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-02
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # Installers are built from the Rust crates in the committed Cargo.lock; stop if it is out of date.
      - name: Check Cargo.lock is up to date
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      # The installers carry THIRD-PARTY-NOTICES.txt: the licence of every bundled library.
      # cargo-about lists the Rust crates; `npm run notices` (run by the Tauri build) adds the JavaScript ones.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about

      - name: List Rust crate licences
        run: cargo about generate --manifest-path src-tauri/Cargo.toml -c src-tauri/about.toml -o src-tauri/rust-licenses.txt src-tauri/about.hbs

      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: FilmOrganizer ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer below.

            - **Windows:** `.msi` or `-setup.exe`
            - **macOS:** `.dmg` (works on Apple Silicon and Intel Macs)
            - **Linux:** `.AppImage` (any distribution) or `.deb` (Debian / Ubuntu)

            These builds are not code-signed, so Windows and macOS show a warning the first
            time you open the app. See "Download" in the README for the one-time steps.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep installers as workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilmOrganizer-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: warn

  # SHA256SUMS.txt lets people check that a downloaded installer is exactly the one built here.
  checksums:
    name: Publish checksums
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
